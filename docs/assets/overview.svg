  <rect x="62" y="57" width="10" height="106" rx="5" fill="url(#accent)"/>
  <text x="100" y="108" font-size="57" font-weight="700" class="white">EdgeFall</text>
  <text x="102" y="151" font-size="25" class="muted">Shared spatial features. Causal temporal reasoning. Visible event output.</text>
