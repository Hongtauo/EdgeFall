  <rect x="804" y="680" width="350" height="170" rx="20" class="card"/>
  <text x="831" y="721" class="small muted">HISTORICAL ONLINE MEASUREMENT</text><text x="831" y="780" font-size="44" font-weight="700" fill="#91d5f4">44.34 ms</text><text x="831" y="817" font-size="17" class="muted">RTX 4070 Ti SUPER · 1 person</text><text x="831" y="840" font-size="17" class="muted">UR Fall · algorithm only, excludes decode</text>
