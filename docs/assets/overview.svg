<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">EdgeFall: causal video fall detection from shared spatial features to events</title>
  <desc id="desc">Original architecture illustration. Monocular video enters one YOLO26s pass, which supplies geometry, global and person ROI features. A causal 3.2-second history and geometry-conditioned visual attention produce person-level scores and an event demonstration. Metric cards distinguish cached-feature evaluation and online latency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#11304d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#50dfbf"/><stop offset="1" stop-color="#70cfff"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75dccb"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif} .white{fill:#f4f8fc}.muted{fill:#b0c6d8}.small{font-size:19px}.body{font-size:23px}.label{font-size:22px;font-weight:700}.line{stroke:#75dccb;stroke-width:3;fill:none;marker-end:url(#arrow)}.card{fill:#102e48;stroke:#33526b;stroke-width:1.5}</style>
  </defs>
